# Semver release from Conventional Commits on every push to main.
#   feat!: ... / BREAKING CHANGE: footer  -> major  (whole new README)
#   feat: ...                             -> minor  (new card / section)
#   fix: ...                              -> patch  (tweak, typo, fix)
# Highest bump since the last v* tag wins. No matching commits -> no release.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write # create tag + release

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need full history + tags

      - name: Bump version and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range=${last:+$last..}HEAD

          subjects=$(git log --format=%s "$range")
          bodies=$(git log --format=%b "$range")

          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
            bump="major"
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
            bump="minor"
          elif grep -qE '^fix(\([^)]*\))?:' <<<"$subjects"; then
            bump="patch"
          else
            echo "No feat/fix/breaking commits since ${last:-start}, skipping release."
            exit 0
          fi

          IFS=. read -r major minor patch <<<"${last#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case $bump in
            major) major=$((major + 1)) minor=0 patch=0 ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"

          git log --format='- %s (%h)' "$range" | grep -E '^- [a-z]+(\([^)]*\))?!?:' > notes.md || true
          echo "Releasing $tag ($bump) from ${last:-start}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
