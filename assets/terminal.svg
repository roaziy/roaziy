<svg xmlns="http://www.w3.org/2000/svg" width="860" height="512" viewBox="0 0 860 512" role="img" aria-labelledby="t">
  <title id="t">roaziy: iOS and web developer, software engineer at Shop.mn, IT student at MUST, Ulaanbaatar</title>
  <style>
    text { font: 14px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; fill: #c9d1d9; white-space: pre; }
    .ttl { font-size: 12px; fill: #8b949e; }
    .g { fill: #3fb950; } .c { fill: #79c0ff; font-weight: 700; } .d { fill: #8b949e; }
    .r { fill: #ff7b72; font-weight: 700; } .o { fill: #ffa657; } .k { fill: #79c0ff; } .dir { fill: #58a6ff; font-weight: 700; }
    .cur { fill: #c9d1d9; }

    /* timeline: every line starts hidden, each element sets its own delay inline */
    .l  { opacity: 0; animation: on .01s forwards; }
    .co { animation: off .01s forwards; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes on { to { opacity: 1; } }
    @keyframes off { to { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    /* typing: cover + cursor slide right one char (8.4px) per step; distance = chars * 8.4 */
    @keyframes t1 { to { transform: translateX(50.4px); } }
    @keyframes t2 { to { transform: translateX(67.2px); } }
    @keyframes t3 { to { transform: translateX(109.2px); } }
    @keyframes t4 { to { transform: translateX(126px); } }

    @media (prefers-reduced-motion: reduce) {
      .l { animation: none !important; opacity: 1; }
      .ty { display: none; }
      .blink { animation: none; }
    }
  </style>

  <defs><clipPath id="w"><rect width="860" height="512" rx="10"/></clipPath></defs>

  <g clip-path="url(#w)">
    <rect width="860" height="512" fill="#0d1117"/>
    <rect width="860" height="36" fill="#161b22"/>
    <rect y="36" width="860" height="1" fill="#30363d"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="6" fill="#febc2e"/>
    <circle cx="60" cy="18" r="6" fill="#28c840"/>
    <text class="ttl" x="430" y="22" text-anchor="middle">roaziy@ulaanbaatar: ~ — zsh</text>

    <!-- $ whoami -->
