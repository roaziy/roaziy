    <text class="l" x="24" y="444" xml:space="preserve" style="animation-delay:8.1s">hello@roaziy.dev  <tspan class="d">·</tspan>  roaziy.dev  <tspan class="d">·</tspan>  x.com/roaziy  <tspan class="d">·</tspan>  linkedin.com/in/roaziy</text>

    <!-- idle prompt -->
    <g class="l" style="animation-delay:8.5s">
      <text class="g" x="24" y="486">➜</text><text class="c" x="40.8" y="486">~</text>
      <rect class="cur blink" x="57.6" y="473" width="8.4" height="17"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="859" height="511" rx="10" fill="none" stroke="#30363d"/>
