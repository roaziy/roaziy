      <text class="g" x="24" y="66">➜</text><text class="c" x="40.8" y="66">~</text>
      <text x="57.6" y="66" textLength="50.4" lengthAdjust="spacingAndGlyphs">whoami</text>
      <g class="ty" style="animation:t1 .42s steps(6) .8s forwards">
        <rect x="57.6" y="51" width="50.4" height="20" fill="#0d1117"/>
        <rect class="cur co" x="57.6" y="53" width="8.4" height="17" style="animation-delay:1.5s"/>
      </g>
    </g>
    <text class="l" x="24" y="87" style="animation-delay:1.5s">roaziy <tspan class="d">·</tspan> software engineer @ Shop.mn <tspan class="d">·</tspan> Ulaanbaatar, Mongolia</text>

    <!-- $ neofetch -->
    <g class="l" style="animation-delay:1.9s">
      <text class="g" x="24" y="129">➜</text><text class="c" x="40.8" y="129">~</text>
      <text x="57.6" y="129" textLength="67.2" lengthAdjust="spacingAndGlyphs">neofetch</text>
      <g class="ty" style="animation:t2 .56s steps(8) 2.4s forwards">
        <rect x="57.6" y="114" width="67.2" height="20" fill="#0d1117"/>
        <rect class="cur co" x="57.6" y="116" width="8.4" height="17" style="animation-delay:3.3s"/>
      </g>
    </g>

    <!-- ascii ger (25 cols) + info at col 28 -->
    <g class="l" style="animation-delay:3.3s">
      <text class="r" x="24" y="150" xml:space="preserve">           .-.           </text>
      <text x="259.2" y="150"><tspan class="r">roaziy</tspan><tspan class="d">@</tspan><tspan class="r">ulaanbaatar</tspan></text>
    </g>
    <g class="l" style="animation-delay:3.35s">
      <text class="r" x="24" y="171" xml:space="preserve">       _.-'   '-._       </text>
      <text class="d" x="259.2" y="171">------------------</text>
    </g>
    <g class="l" style="animation-delay:3.4s">
      <text class="r" x="24" y="192" xml:space="preserve">   _.-'           '-._   </text>
      <text x="259.2" y="192"><tspan class="k">role</tspan><tspan x="343.2">iOS &amp; web developer</tspan></text>
    </g>
    <g class="l" style="animation-delay:3.45s">
      <text class="r" x="24" y="213" xml:space="preserve"> .'___________________'. </text>
      <text x="259.2" y="213"><tspan class="k">work</tspan><tspan x="343.2">software engineer @ Shop.mn</tspan></text>
    </g>
    <g class="l" style="animation-delay:3.5s">
      <text class="o" x="24" y="234" xml:space="preserve"> |.:.:.:.  ___  .:.:.:.| </text>
      <text x="259.2" y="234"><tspan class="k">school</tspan><tspan x="343.2">MUST <tspan class="d">·</tspan> information technology</tspan></text>
    </g>
    <g class="l" style="animation-delay:3.55s">
      <text class="o" x="24" y="255" xml:space="preserve"> |        |   |        | </text>
      <text x="259.2" y="255"><tspan class="k">stack</tspan><tspan x="343.2">Swift <tspan class="d">·</tspan> TypeScript <tspan class="d">·</tspan> Next.js <tspan class="d">·</tspan> Express</tspan></text>
    </g>
    <g class="l" style="animation-delay:3.6s">
      <text class="o" x="24" y="276" xml:space="preserve"> |________|___|________| </text>
      <text x="259.2" y="276"><tspan class="k">learning</tspan><tspan x="343.2">React Native <tspan class="d">·</tspan> backend <tspan class="d">·</tspan> AI</tspan></text>
    </g>
    <text class="l" x="259.2" y="297" style="animation-delay:3.65s"><tspan class="k">shipping</tspan><tspan x="343.2">Shagai <tspan class="d">·</tspan> AR iPad game for Swift Student Challenge '26</tspan></text>
    <g class="l" style="animation-delay:3.7s">
      <rect x="259.2" y="305" width="25.2" height="16" fill="#484f58"/>
      <rect x="284.4" y="305" width="25.2" height="16" fill="#ff7b72"/>
      <rect x="309.6" y="305" width="25.2" height="16" fill="#3fb950"/>
      <rect x="334.8" y="305" width="25.2" height="16" fill="#d29922"/>
      <rect x="360" y="305" width="25.2" height="16" fill="#58a6ff"/>
      <rect x="385.2" y="305" width="25.2" height="16" fill="#bc8cff"/>
      <rect x="410.4" y="305" width="25.2" height="16" fill="#39c5cf"/>
      <rect x="435.6" y="305" width="25.2" height="16" fill="#b1bac4"/>
    </g>

    <!-- $ ls ~/projects -->
    <g class="l" style="animation-delay:4s">
      <text class="g" x="24" y="360">➜</text><text class="c" x="40.8" y="360">~</text>
      <text x="57.6" y="360" textLength="109.2" lengthAdjust="spacingAndGlyphs">ls ~/projects</text>
      <g class="ty" style="animation:t3 .91s steps(13) 4.5s forwards">
