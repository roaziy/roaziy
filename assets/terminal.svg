    <!-- $ cat contact.txt -->
    <g class="l" style="animation-delay:6.2s">
      <text class="g" x="24" y="423">➜</text><text class="c" x="40.8" y="423">~</text>
      <text x="57.6" y="423" textLength="126" lengthAdjust="spacingAndGlyphs">cat contact.txt</text>
      <g class="ty" style="animation:t4 1.05s steps(15) 6.7s forwards">
